# PhysioNet, short history / long horizon: 12 h history -> 36 h ahead (horizon = 48 - history).
# patch_size and stride are unchanged from configs/baseline.yaml so the horizon axis is the only thing
# that varies; npatch follows as ceil((12 - 6) / 6) + 1 = 2.
_base_: baseline.yaml
data:
  name: physionet
  history: 12
  patch_size: 6
  stride: 6
  batch_size: 32
