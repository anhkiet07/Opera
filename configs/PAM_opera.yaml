# PAM classification. Backbone follows the published classification protocol (PatchTST): the patch-family
# attention keeps sequences short, whereas iTransformer's variate family flattens all patches into one
# sequence and needs ~3 GB per attention on this data.
_base_: opera.yaml
data:
  name: PAM
  patch_size: 10
  stride: 10
  batch_size: 32
  split_idx: 1
model:
  backbone: patchtst
