# OPERA (augmentation + privileged-observation distillation) on P12 in-hospital mortality.
# batch_size 8 matches P12_baseline.yaml: batch size is a property of the setting, not of the arm.
_base_: distillation.yaml
data:
  name: P12
  history: 48
  patch_size: 6
  stride: 6
  batch_size: 8
  split_idx: 1
model:
  backbone: patchtst
