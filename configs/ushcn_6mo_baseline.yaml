# USHCN mid horizon: 24 months of history -> 6 months ahead, between the existing 1-month and
# 12-month settings. USHCN takes its horizon from data.pred_window directly, not from history,
# so history / patch_size / stride are unchanged from configs/ushcn_baseline.yaml (npatch = 16).
_base_: baseline.yaml
data:
  name: ushcn
  history: 24
  patch_size: 1.5
  stride: 1.5
  batch_size: 128
  pred_window: 6
