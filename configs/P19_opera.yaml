# P19 classification. Backbone follows the published classification protocol (PatchTST): the patch-family
# attention keeps sequences short, whereas iTransformer's variate family flattens all patches into one
# sequence and needs ~3 GB per attention on this data.
_base_: opera.yaml
data:
  name: P19
  patch_size: 3.75
  stride: 3.75
  batch_size: 32
  split_idx: 1
model:
  backbone: patchtst
