# Human Activity, short history / long horizon: 1000 ms history -> 3000 ms ahead (horizon = 4000 - history).
# patch_size and stride unchanged from configs/activity_baseline.yaml; npatch = ceil((1000 - 750) / 750) + 1 = 2,
# the minimum for the patch-family backbones.
_base_: baseline.yaml
data:
  name: activity
  history: 1000
  patch_size: 750
  stride: 750
  batch_size: 32
