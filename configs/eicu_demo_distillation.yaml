# OPERA (augmentation + privileged-observation distillation) on eICU-demo mortality under region shift.
# No hard mining: mining belongs to OPERA++ (see configs/*_operapp.yaml).
_base_: distillation.yaml
data:
  name: eicu_demo
  patch_size: 3.75
  stride: 3.75
  batch_size: 32
  split_idx: 1
model:
  backbone: patchtst
