# Human Activity: 4 body sensors x 3 axes (12 variables), 5,400 windows of 3000 ms history -> 1000 ms horizon.
# Windows come from the repo's sliding-window chunking (stride = horizon), i.e. the published protocol.
_base_: baseline.yaml
data:
  name: activity
  history: 3000
  patch_size: 750
  stride: 750
  batch_size: 32
