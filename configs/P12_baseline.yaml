# P12 in-hospital mortality. Backbone follows the published classification protocol (PatchTST).
# batch_size 8: P12's attention peaks at 4.7 GB with a single view at 32, and iTransformer's variate family
# flattens all patches into one sequence, which exhausts the 8 GB card even at 16 (it surfaces as a misleading
# "CUDA driver error: device not ready"). Batch size is a property of the setting, so every backbone and every
# arm on P12 uses 8 and the comparison stays like-for-like.
_base_: baseline.yaml
data:
  name: P12
  history: 48
  patch_size: 6
  stride: 6
  batch_size: 8
  split_idx: 1
model:
  backbone: patchtst
