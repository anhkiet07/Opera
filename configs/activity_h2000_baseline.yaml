# Human Activity, balanced split: 2000 ms history -> 2000 ms ahead (horizon = 4000 - history).
# patch_size and stride unchanged from configs/activity_baseline.yaml so the horizon axis is the only
# thing that varies; npatch = ceil((2000 - 750) / 750) + 1 = 3.
_base_: baseline.yaml
data:
  name: activity
  history: 2000
  patch_size: 750
  stride: 750
  batch_size: 32
